<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio | Encens du ciel Étoile</title>
  <style>
    body {
      margin: 0;
      font-family: "Hiragino Kaku Gothic ProN", sans-serif;
      background: linear-gradient(180deg, #000814, #001d3d);
      color: #fff;
      text-align: center;
      padding: 60px 20px;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 40px;
    }

    .works {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      max-width: 900px;
      margin: 0 auto;
    }

    .work {
      background: rgba(255,255,255,0.05);
      border-radius: 12px;
      padding: 20px;
      transition: transform .3s ease, background .3s ease;
    }

    .work:hover {
      transform: translateY(-6px);
      background: rgba(255,255,255,0.1);
    }

    a {
      color: #9ad4ff;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <h1>ポートフォリオ</h1>

  <div class="works">
    <div class="work">
      <h2>🌙 Encens du ciel Étoile</h2>
      <p>静かな夜に寄り添うジンブランドLP</p>
      <a href="index.html" target="_blank">▶ ページを開く</a>
    </div>
</div>
</body>
</html>
